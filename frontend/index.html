<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Жол-ID Карго</title>
  <meta name="description" content="Единое цифровое окно для грузовых перевозок: участники, отслеживание, документы, электронные декларации, расчёт стоимости">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <section id="auth-screen" class="auth" hidden></section>

  <div id="app" hidden>
    <header class="top">
      <a href="#" class="brand home-link" id="home-link" title="На главную">
        <div class="logo" aria-hidden="true">Ж</div>
        <div>
          <div class="brand-name">Жол-ID <span>Карго</span></div>
          <div class="brand-sub">Единое окно для грузовых перевозок</div>
        </div>
      </a>
      <nav class="tabs" id="nav"></nav>
      <div class="user-box" id="user-box"></div>
    </header>

    <main>
      <section id="tab-monitor" class="tab"></section>
      <section id="tab-track" class="tab"></section>
      <section id="tab-new" class="tab"></section>
      <section id="tab-calc" class="tab"></section>
      <section id="tab-decl" class="tab"></section>
      <section id="tab-ledger" class="tab"></section>
      <section id="tab-effect" class="tab"></section>
    </main>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true">
      <button class="icon-btn modal-close no-print" data-close aria-label="Закрыть">✕</button>
      <div id="modal-body"></div>
    </div>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
